<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600">
  <defs>
    <linearGradient id="bgT1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F0ED"/>
      <stop offset="100%" style="stop-color:#D4E3DC"/>
    </linearGradient>
    <linearGradient id="skinT1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8956C"/>
      <stop offset="100%" style="stop-color:#A87050"/>
    </linearGradient>
    <linearGradient id="coatT1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAF8"/>
      <stop offset="100%" style="stop-color:#ECEAE6"/>
    </linearGradient>
    <clipPath id="circleClip1">
      <circle cx="240" cy="220" r="115"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="480" height="600" fill="url(#bgT1)"/>

  <!-- Patrón de fondo -->
  <pattern id="dots1" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="#2C4A3E" opacity="0.08"/>
  </pattern>
  <rect width="480" height="600" fill="url(#dots1)"/>

  <!-- Acento de color lateral -->
  <rect x="0" y="0" width="6" height="600" fill="#2C4A3E" opacity="0.6"/>

  <!-- Bata médica (cuerpo) -->
  <path d="M 80 600 L 80 440 Q 80 380 120 360 L 200 330 L 280 330 L 360 360 Q 400 380 400 440 L 400 600 Z"
        fill="url(#coatT1)"/>
  <!-- Cuello de la bata -->
  <path d="M 200 330 L 240 360 L 280 330" fill="none" stroke="#DDDBD7" stroke-width="1.5"/>

  <!-- Ropa interior (debajo bata) -->
  <path d="M 200 330 L 240 300 L 280 330 L 280 350 L 240 350 L 200 350 Z" fill="#2C4A3E" opacity="0.7"/>

  <!-- Cuello/garganta -->
  <rect x="210" y="270" width="60" height="60" rx="0" fill="url(#skinT1)"/>

  <!-- Cabeza -->
  <ellipse cx="240" cy="200" rx="100" ry="115" fill="url(#skinT1)"/>

  <!-- Cabello oscuro - pelo largo recogido -->
  <ellipse cx="240" cy="130" rx="105" ry="70" fill="#2A1A0A"/>
  <path d="M 140 200 Q 130 160 142 130 Q 155 100 200 90 L 240 85 L 280 90 Q 325 100 338 130 Q 350 160 340 200"
        fill="#2A1A0A"/>
  <!-- Mechones laterales -->
  <path d="M 140 200 Q 125 240 135 280 Q 140 300 155 310" fill="#2A1A0A" stroke="#2A1A0A" stroke-width="1"/>
  <path d="M 340 200 Q 355 240 345 280 Q 340 300 325 310" fill="#2A1A0A" stroke="#2A1A0A" stroke-width="1"/>

  <!-- Recogido de pelo en la nuca -->
  <ellipse cx="240" cy="88" rx="45" ry="18" fill="#1A0F05"/>

  <!-- Ojos -->
  <ellipse cx="205" cy="210" rx="16" ry="10" fill="#1A1008"/>
  <ellipse cx="275" cy="210" rx="16" ry="10" fill="#1A1008"/>
  <!-- Brillos en ojos -->
  <circle cx="210" cy="206" r="3" fill="#FAFAF8"/>
  <circle cx="280" cy="206" r="3" fill="#FAFAF8"/>
  <!-- Iris -->
  <circle cx="205" cy="210" r="8" fill="#4A2A10"/>
  <circle cx="275" cy="210" r="8" fill="#4A2A10"/>
  <circle cx="209" cy="207" r="2.5" fill="#FAFAF8"/>
  <circle cx="279" cy="207" r="2.5" fill="#FAFAF8"/>
  <!-- Pestañas superiores -->
  <path d="M 190 203 Q 205 198 220 203" fill="none" stroke="#1A1008" stroke-width="2" stroke-linecap="round"/>
  <path d="M 260 203 Q 275 198 290 203" fill="none" stroke="#1A1008" stroke-width="2" stroke-linecap="round"/>
  <!-- Cejas -->
  <path d="M 188 193 Q 205 187 222 191" fill="none" stroke="#2A1A0A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 258 191 Q 275 187 292 193" fill="none" stroke="#2A1A0A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nariz -->
  <path d="M 232 215 Q 228 235 220 245 Q 230 250 240 248 Q 250 250 260 245 Q 252 235 248 215"
        fill="none" stroke="#A87050" stroke-width="1.2" opacity="0.6"/>

  <!-- Sonrisa -->
  <path d="M 210 268 Q 240 290 270 268" fill="none" stroke="#8A5040" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Labios -->
  <path d="M 210 265 Q 225 260 240 262 Q 255 260 270 265 Q 260 278 240 280 Q 220 278 210 265 Z"
        fill="#C06850" opacity="0.7"/>

  <!-- Mejillas con rubor sutil -->
  <circle cx="185" cy="255" r="25" fill="#D4806A" opacity="0.15"/>
  <circle cx="295" cy="255" r="25" fill="#D4806A" opacity="0.15"/>

  <!-- Orejas -->
  <ellipse cx="140" cy="220" rx="14" ry="18" fill="url(#skinT1)"/>
  <ellipse cx="340" cy="220" rx="14" ry="18" fill="url(#skinT1)"/>

  <!-- Estetoscopio / detalle médico -->
  <path d="M 170 390 Q 160 420 180 440 Q 200 455 240 450 Q 280 455 300 440 Q 320 420 310 390"
        fill="none" stroke="#8A8A85" stroke-width="2.5"/>
  <circle cx="240" cy="450" r="12" fill="none" stroke="#8A8A85" stroke-width="2"/>
  <circle cx="240" cy="450" r="6" fill="#8A8A85" opacity="0.5"/>

  <!-- Texto nombre -->
  <line x1="40" y1="555" x2="440" y2="555" stroke="#2C4A3E" stroke-width="0.5" opacity="0.4"/>
  <text x="240" y="577" font-family="Georgia, serif" font-size="15" font-weight="400"
        letter-spacing="2" fill="#2C4A3E" text-anchor="middle" opacity="0.9">Dra. Valentina Rojas</text>
  <text x="240" y="595" font-family="Arial, sans-serif" font-size="9" font-weight="300"
        letter-spacing="3" fill="#8A8A85" text-anchor="middle" opacity="0.8">DIRECTORA · IMPLANTOLOGÍA</text>
</svg>
